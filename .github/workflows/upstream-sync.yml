# SolidCraft_Cloud: hält den Fork auf dem Stand von tangency-labs/solidcraft (M5).
#
# Mehrmals täglich: Upstream holen, auf main mergen (Branch sync/upstream) und einen Pull Request
# öffnen. Die Workflow-Dateien (.github/workflows) bleiben dabei immer auf unserem Stand: Upstreams
# Workflows laufen im Fork nicht, und so braucht der Push keine "workflow"-Berechtigung.
# Echte Konflikte lassen den Lauf rot enden; die Dateien stehen in der Zusammenfassung des Laufs.
# Ein bereits offener Sync-PR wird bei neuem Upstream-Stand neu aufgebaut (nur dieser Branch wird
# überschrieben, nie main).
#
# Hinweis: Pull Requests, die mit dem eingebauten GITHUB_TOKEN entstehen, starten keine weiteren
# Workflows (CI). Wer die CI am Sync-PR will, legt ein Secret SYNC_TOKEN an (Personal Access
# Token mit "repo" und "workflow"); der Workflow nimmt es automatisch.
name: Upstream sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/tangency-labs/solidcraft.git
  BRANCH: sync/upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_ENV"
          echo "Fork is $behind upstream commits behind."

      - name: Merge upstream into a sync branch
        if: env.behind != '0'
        id: merge
        run: |
          git config user.name "solidcraft-cloud-sync"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BRANCH" main
          git merge --no-commit --no-ff upstream/main || true
          # Workflow-Dateien: immer unser Stand (auch bei Konflikten), Upstream-Neuzugänge entfernen.
          git checkout main -- .github/workflows
          for f in $(git ls-files .github/workflows); do
            git cat-file -e "main:$f" 2>/dev/null || git rm -qf "$f"
          done
          git diff --name-only --diff-filter=U > conflicts.txt
          if [ -s conflicts.txt ]; then
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "Upstream abgleichen (tangency-labs/solidcraft main)"
            echo "result=clean" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch and open or update the pull request
        if: env.behind != '0' && steps.merge.outputs.result == 'clean'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          git push --force origin "$BRANCH"
          open=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)
          body="Automatischer Abgleich mit tangency-labs/solidcraft: $behind neue Upstream-Commits, ohne Konflikte."
          if [ -z "$open" ]; then
            if ! gh pr create --base main --head "$BRANCH" --title "Upstream abgleichen" --body "$body"; then
              echo "::warning::Pull Request konnte nicht automatisch erstellt werden (Token-Berechtigung). Branch '$BRANCH' wurde trotzdem aktualisiert."
              {
                echo "### Upstream-Abgleich: Pull Request konnte nicht automatisch erstellt werden"
                echo
                echo "Der Branch \`$BRANCH\` wurde aktualisiert, aber \`gh pr create\` wurde abgelehnt."
                echo "Bitte die Repository-Einstellung \"Allow GitHub Actions to create and approve pull requests\" aktivieren"
                echo "oder \`SYNC_TOKEN\` als Secret mit passenden Rechten hinterlegen."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            if ! gh pr comment "$open" --body "Neu aufgebaut: jetzt $behind Upstream-Commits vor main."; then
              echo "::warning::Kommentar auf PR #$open konnte nicht geschrieben werden (Token-Berechtigung)."
            fi
          fi

      - name: Report conflicts
        if: env.behind != '0' && steps.merge.outputs.result == 'conflict'
        run: |
          {
            echo "### Upstream-Abgleich: Konflikte ($behind Commits)"
            echo
            sed 's/^/- `/; s/$/`/' conflicts.txt
            echo
            echo 'Lokal lösen: `git fetch upstream && git checkout -b sync/manual origin/main && git merge upstream/main`, beide Seiten behalten, Pull Request öffnen.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream-Abgleich hat Konflikte: $(tr '\n' ' ' < conflicts.txt)"
          exit 1
