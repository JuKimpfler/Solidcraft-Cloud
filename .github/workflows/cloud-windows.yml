# SolidCraft_Cloud: baut die Desktop-App für Windows x64 (nur diese Plattform).
#
# Von Hand starten: Actions -> "Cloud Windows" -> Run workflow. Ergebnis als Artefakt "solidcraft-windows-x64"
# (31 Tage): solidcraft-<version>-windows-x64.msi (Installer), ...-portable.zip (entpacken und starten)
# und SolidCraft-<version>-windows-x64.exe (die App allein). Bei einem Tag "cloud-v*" werden die
# Dateien zusätzlich an ein GitHub-Release gehängt.
name: Cloud Windows

on:
  workflow_dispatch:
  push:
    tags: ["cloud-v*"]

permissions:
  contents: write

concurrency:
  group: cloud-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: cloud-windows-x64
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build and package (msi, portable zip, exe)
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: solidcraft-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 31
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/cloud-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/release/* \
            || gh release upload "$GITHUB_REF_NAME" --clobber dist/release/*
