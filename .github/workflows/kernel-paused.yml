# While a new geometry kernel is evaluated, new issues, pull requests and discussions about kernel
# work are labelled `kernel-paused` for a maintainer to answer (CONTRIBUTING.md, "Kernel work is
# paused"). The logic is in scripts/kernel-paused/ (tested in ci.yml).
name: Kernel paused

# SolidCraft_Cloud: nur noch von Hand startbar (Upstream-Workflow, im Fork nicht gebraucht).
on:
  workflow_dispatch:

permissions:
  contents: read # to check out scripts/kernel-paused
  issues: write
  pull-requests: read # to list a PR's changed paths
  discussions: write

concurrency:
  group: kernel-paused-${{ github.event.issue.number || github.event.pull_request.number || github.event.discussion.number }}
  cancel-in-progress: false

jobs:
  paused:
    name: Kernel paused bot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/kernel-paused
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const paused = require('./scripts/kernel-paused/kernel-paused.js');
            const done = context.eventName === 'discussion'
              ? await paused.handleDiscussion({ github, context })
              : await paused.handleOpened({ github, context });
            core.info(done);
